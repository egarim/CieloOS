name: ci

# The release workflow builds a bundle and checks what is inside the tarball. It
# has never run a test. That is how v0.1.8 was tagged with a red backend suite:
# CI was green, because CI was not looking.
#
# This runs on every push and pull request to main, and it runs both suites.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: dotnet test
        run: bash scripts/ci/test.sh backend

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Frontend build and tests
        run: bash scripts/ci/test.sh frontend
