name: Host preflight smoke
on:
  pull_request:
    paths:
      - 'distro/preflight.sh'
      - 'tests/preflight-smoke.sh'
      - '.github/workflows/preflight-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/preflight-smoke.sh
