name: Host preflight smoke
on:
  pull_request:
    paths:
      - 'distro/install.sh'
      - 'distro/scripts/build-release.sh'
      - 'distro/preflight.sh'
      - 'distro/cpu-flags.sh'
      - 'distro/install-conflicts.sh'
      - 'tests/preflight-conflicts.sh'
      - 'tests/preflight-cpu-fixtures.sh'
      - 'tests/preflight-smoke.sh'
      - '.github/workflows/preflight-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/preflight-smoke.sh

      - run: bash tests/preflight-cpu-fixtures.sh

      - run: bash tests/preflight-conflicts.sh

      - run: bash -n distro/install.sh && bash -n distro/scripts/build-release.sh
